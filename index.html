<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas para Ti</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fira+Code:wght@400;500&family=Poppins:wght@300;400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #12000a;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(255, 20, 147, 0.35) 0%, transparent 60%),
        radial-gradient(circle at 50% 80%, rgba(138, 43, 226, 0.3) 0%, transparent 60%);
      min-height: 100vh;
      overflow-x: hidden;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px 10px;
    }

    /* Contenedor Superior (Video / Galaxia) */
    .galaxy-frame {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 280px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 215, 0, 0.3);
      margin-bottom: 20px;
      background: linear-gradient(rgba(5, 2, 10, 0.7), rgba(5, 2, 10, 0.7)), url('foto.jpg');
      background-size: cover;
      background-position: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .galaxy-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .heart-center {
      position: absolute;
      width: 80px;
      height: 80px;
      cursor: pointer;
      pointer-events: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 0 15px rgba(255, 223, 0, 0.9));
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .flower-item {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s;
    }

    .flower-item:active {
      transform: scale(1.2) !important;
    }

    .flower-img {
      font-size: 1.5rem;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.9));
    }

    .flower-text {
      font-size: 0.6rem;
      font-weight: 600;
      color: #fff3a1;
      text-shadow: 0 0 5px #ffaa00;
      white-space: nowrap;
      margin-top: 2px;
      background: rgba(0, 0, 0, 0.7);
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid rgba(255, 223, 0, 0.4);
    }

    /* Tarjeta Inferior Style.css */
    .code-card {
      background-color: #031422;
      width: 100%;
      max-width: 420px;
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-family: 'Fira Code', monospace;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .dots {
      display: flex;
      gap: 7px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .dot-red { background-color: #ff5f56; }
    .dot-yellow { background-color: #ffbd2e; }
    .dot-green { background-color: #27c93f; }

    .filename {
      color: #a0aec0;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .code-container {
      line-height: 1.7;
      font-size: 0.9rem;
    }

    .line {
      display: flex;
      align-items: center;
    }

    .line-num {
      color: #3b4c5a;
      width: 28px;
      user-select: none;
    }

    .selector { color: #f6e05e; }
    .property { color: #e2e8f0; }
    .punctuation { color: #e2e8f0; }
    .keyword { color: #ff5370; }
    .number { color: #f78c6c; }
    .string { color: #c3e88d; }
    .variable { color: #ff5370; }
    .var-name { color: #89ddff; }

    /* Modal / Carta Pop-up */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .letter-card {
      background: linear-gradient(135deg, #fceabb 0%, #f8b500 100%);
      color: #332200;
      width: 85%;
      max-width: 340px;
      padding: 26px 20px;
      border-radius: 20px;
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.8);
      text-align: center;
      transform: translateY(20px);
      transition: transform 0.4s ease;
    }

    .modal.active .letter-card {
      transform: translateY(0);
    }

    .letter-card h1 {
      font-family: 'Caveat', cursive;
      font-size: 2.7rem;
      margin-bottom: 10px;
      color: #4a3000;
    }

    .letter-card p {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 16px;
      color: #332200;
    }

    .btn-close {
      background: #4a3000;
      color: #fff3a1;
      border: none;
      padding: 9px 24px;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Marco de la Galaxia 3D -->
  <div class="galaxy-frame">
    <canvas id="starsCanvas"></canvas>

    <div class="galaxy-container">
      <div class="heart-center" id="heartCenter">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#yellowGlow)" />
          <defs>
            <radialGradient id="yellowGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(12 12) rotate(90) scale(12)">
              <stop stop-color="#ffff80" />
              <stop offset="0.6" stop-color="#ffcc00" />
              <stop offset="1" stop-color="#ff9900" />
            </radialGradient>
          </defs>
        </svg>
      </div>

      <div id="orbitContainer" style="position: absolute; width: 100%; height: 100%; pointer-events: none;"></div>
    </div>
  </div>

  <!-- Tarjeta del Código CSS -->
  <div class="code-card">
    <div class="card-header">
      <div class="dots">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
      </div>
      <div class="filename">Style.css</div>
    </div>
    <div class="code-container">
      <div class="line"><span class="line-num">1</span><span><span class="selector">Flores_Amarillas</span> <span class="punctuation">{</span></span></div>
      <div class="line"><span class="line-num">2</span><span>&nbsp;&nbsp;<span class="property">position</span><span class="punctuation">:</span> <span class="keyword">absolute</span><span class="punctuation">;</span></span></div>
      <div class="line"><span class="line-num">3</span><span>&nbsp;&nbsp;<span class="property">width</span><span class="punctuation">:</span> <span class="number">90%</span><span class="punctuation">;</span></span></div>
      <div class="line"><span class="line-num">4</span><span>&nbsp;&nbsp;<span class="property">font-size</span><span class="punctuation">:</span> <span class="number">2rem</span><span class="punctuation">;</span></span></div>
      <div class="line"><span class="line-num">5</span><span>&nbsp;&nbsp;<span class="property">font-family</span><span class="punctuation">:</span> <span class="string">"Te Amo"</span><span class="punctuation">;</span></span></div>
      <div class="line"><span class="line-num">6</span><span>&nbsp;&nbsp;<span class="property">height</span><span class="punctuation">:</span> <span class="variable">var</span><span class="punctuation">(</span><span class="var-name">--letter-love</span><span class="punctuation">)</span><span class="punctuation">;</span></span></div>
      <div class="line"><span class="line-num">7</span><span>&nbsp;&nbsp;<span class="property">transform</span><span class="punctuation">:</span> <span class="keyword">translateX</span><span class="punctuation">(</span><span class="number">-50%</span><span class="punctuation">)</span><span class="punctuation">;</span></span></div>
      <div class="line"><span class="line-num">8</span><span>&nbsp;&nbsp;<span class="property">background</span><span class="punctuation">:</span> <span class="variable">var</span><span class="punctuation">(</span><span class="var-name">--letter</span><span class="punctuation">)</span><span class="punctuation">;</span></span></div>
      <div class="line"><span class="line-num">9</span><span><span class="punctuation">}</span></span></div>
    </div>
  </div>

  <!-- Modal / Carta -->
  <div class="modal" id="letterModal">
    <div class="letter-card">
      <h1 id="modalTitle">Mi niña</h1>
      <p id="modalBody">Mensaje especial...</p>
      <h2 style="font-family: 'Caveat', cursive; font-size: 2.2rem; margin-bottom: 16px; color: #4a3000;">Te Amo</h2>
      <button class="btn-close" id="btnClose">Cerrar</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('starsCanvas');
    const ctx = canvas.getContext('2d');
    const frame = document.querySelector('.galaxy-frame');

    let width = canvas.width = frame.clientWidth;
    let height = canvas.height = frame.clientHeight;

    const particles = [];
    const particleCount = 400;

    for (let i = 0; i < particleCount; i++) {
      particles.push({
        radius: Math.random() * Math.min(width, height) * 0.45,
        angle: Math.random() * Math.PI * 2,
        speed: 0.001 + Math.random() * 0.002,
        size: Math.random() * 2 + 0.5,
        color: ['#ffffff', '#ffe600', '#ffc400', '#ff9100'][Math.floor(Math.random() * 4)]
      });
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      const cx = width / 2;
      const cy = height / 2;

      particles.forEach(p => {
        p.angle += p.speed;
        const x = cx + Math.cos(p.angle) * p.radius;
        const y = cy + Math.sin(p.angle) * (p.radius * 0.45);

        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 6;
        ctx.shadowColor = p.color;
        ctx.fill();
      });

      requestAnimationFrame(animate);
    }
    animate();

    const itemsData = [
      { text: 'Te Amo', icon: '🌻', title: 'Para ti', body: 'Estas flores amarillas son un detalle sencillo para recordarte lo especial e increíble que eres en mi vida.' },
      { text: 'Eres mi sol', icon: '💐', title: 'Mi sol', body: 'Con solo una sonrisa tuya logras iluminar mi día entero. Gracias por existir y darme tanta alegría.' },
      { text: 'Mi niña', icon: '🌻', title: 'Mi niña', body: 'Amo cada momento a tu lado. Tu ternura, tu forma de ser y todo de ti me enamora un poco más cada día.' },
      { text: 'Me encantas', icon: '🌻', title: 'Me encantas', body: 'Me encantas en todos los sentidos posibles. No hay nadie en este mundo con quien prefiera estar que contigo.' },
      { text: 'Eres preciosa', icon: '💐', title: 'Eres preciosa', body: 'Tanto por fuera como por dentro, eres la persona más hermosa que he conocido. Simplemente perfecta.' },
      { text: 'Siempre juntos', icon: '🌻', title: 'Siempre juntos', body: 'Quiero estar a tu lado apoyándote y haciéndote feliz en cada paso que des. Eres mi lugar favorito.' },
      { text: 'Eres única', icon: '🌻', title: 'Eres única', body: 'No existen palabras suficientes para describir lo mucho que vales. No hay nadie como tú.' },
      { text: 'Mi Prioridad', icon: '💐', title: 'Mi Prioridad', body: 'Siempre serás mi prioridad y mi pensamiento favorito. Llegaste a mi vida a cambiarlo todo para bien.' }
    ];

    const heartData = {
      title: 'Mi niña hermosa',
      body: 'Estas flores amarillas son como tú: brillantes, radiantes y llenas de vida. Gracias por llenar mi mundo de tanta felicidad.'
    };

    const orbitContainer = document.getElementById('orbitContainer');
    const modal = document.getElementById('letterModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const btnClose = document.getElementById('btnClose');

    function openModal(title, body) {
      modalTitle.textContent = title;
      modalBody.textContent = body;
      modal.classList.add('active');
    }

    const flowerElements = [];

    itemsData.forEach((data, index) => {
      const el = document.createElement('div');
      el.className = 'flower-item';
      el.innerHTML = `<span class="flower-img">${data.icon}</span><span class="flower-text">${data.text}</span>`;
      orbitContainer.appendChild(el);
      
      flowerElements.push({
        element: el,
        angle: (index / itemsData.length) * Math.PI * 2,
        speed: 0.003
      });

      el.addEventListener('click', () => {
        openModal(data.title, data.body);
      });
    });

    function updateOrbit() {
      const cx = width / 2;
      const cy = height / 2;

      flowerElements.forEach(item => {
        item.angle += item.speed;
        const x = cx + Math.cos(item.angle) * (width * 0.38) - 25;
        const y = cy + Math.sin(item.angle) * (height * 0.32) - 20;

        item.element.style.left = `${x}px`;
        item.element.style.top = `${y}px`;
      });

      requestAnimationFrame(updateOrbit);
    }
    updateOrbit();

    document.getElementById('heartCenter').addEventListener('click', () => {
      openModal(heartData.title, heartData.body);
    });

    btnClose.addEventListener('click', () => {
      modal.classList.remove('active');
    });
  </script>
</body>
</html>
